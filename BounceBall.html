<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Songs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e4f5);
      margin: 20px;
      text-align: center;
    }

    #containerbhai {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .itembhai {
      border: 2px dashed rgba(19, 17, 22, 0.466);
      margin: 8px;
      padding: 15px;
      border-radius: 10px;
      width: 120px;
      text-align: center;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }

    /* Different background colors */
    #itembhai1 { background: #4a90e2; }
    #itembhai2 { background: #50e3c2; }
    #itembhai3 { background: #7ed321; }
    #itembhai4 { background: #f5a623; }
    #itembhai5 { background: #d0021b; }

    /* Hover effect */
    .itembhai:hover {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* Animation classes */
    .bounce {
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Buttons */
    .controls {
      margin-top: 20px;
    }
    .btn {
      background: #4a90e2;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #357ab8;
    }
  </style>
</head>
<body>
  <h2>🎵 Animated Songs</h2>
  <div class="controls">
    <button class="btn" onclick="applyAnimation('bounce')">Bounce</button>
    <button class="btn" onclick="applyAnimation('spin')">Spin</button>
    <button class="btn" onclick="applyAnimation('pulse')">Pulse</button>
    <button class="btn" onclick="removeAnimation()">Reset</button>
  </div>

  <section>
    <div id="containerbhai">
      <div id="itembhai1" class="itembhai">Song 1</div>
      <div id="itembhai2" class="itembhai">Song 2</div>
      <div id="itembhai3" class="itembhai">Song 3</div>
      <div id="itembhai4" class="itembhai">Song 4</div>
      <div id="itembhai5" class="itembhai">Song 5</div>
    </div>
  </section>

  <script>
    function applyAnimation(animation) {
      const items = document.querySelectorAll('.itembhai');
      items.forEach(item => {
        item.classList.remove('bounce', 'spin', 'pulse');
        item.classList.add(animation);
      });
    }

    function removeAnimation() {
      const items = document.querySelectorAll('.itembhai');
      items.forEach(item => {
        item.classList.remove('bounce', 'spin', 'pulse');
      });
    }
  </script>
</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realistic Meteor Ball</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e4f5);
      margin: 20px;
      text-align: center;
    }

    .box {
      width: 600px;
      height: 400px;
      border: 3px solid #4a90e2;
      border-radius: 10px;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .ball {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ff5f6d, #ffc371);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .controls {
      margin-top: 20px;
    }
    .btn {
      background: #4a90e2;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #357ab8;
    }
  </style>
</head>
<body>
  <h2>☄️ Meteor-Like Bouncing Ball</h2>
  <div class="controls">
    <button class="btn" onclick="increasePower()">Increase Power</button>
    <button class="btn" onclick="resetBall()">Reset Ball</button>
  </div>

  <div class="box" id="box">
    <div class="ball" id="ball"></div>
  </div>

  <script>
    const ball = document.getElementById("ball");
    const box = document.getElementById("box");

    let x = 300, y = 200; // initial position
    let vx = 4, vy = 2;   // velocity
    let gravity = 0.4;    // gravity force
    let friction = 0.99;  // slows down over time

    function animate() {
      vy += gravity; // gravity effect
      x += vx;
      y += vy;

      // Bounce off walls
      if (x <= 0) {
        x = 0;
        vx = -vx;
      }
      if (x + ball.offsetWidth >= box.offsetWidth) {
        x = box.offsetWidth - ball.offsetWidth;
        vx = -vx;
      }
      if (y <= 0) {
        y = 0;
        vy = -vy;
      }
      if (y + ball.offsetHeight >= box.offsetHeight) {
        y = box.offsetHeight - ball.offsetHeight;
        vy = -vy;
      }

      // Apply friction (speed loss over time)
      vx *= friction;
      vy *= friction;

      ball.style.left = x + "px";
      ball.style.top = y + "px";

      requestAnimationFrame(animate);
    }

    function increasePower() {
      // Boost speed like throwing harder
      vx *= 1.5;
      vy *= 1.5;
    }

    function resetBall() {
      x = 300; y = 200;
      vx = 4; vy = 2;
    }

    animate();
  </script>
</body>
</html>
