<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Snake</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #05050a;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Custom Scrollbar for Settings Modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 3px;
        }

        /* Neon Glow Effects */
        .neon-text-cyan {
            text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }
        .neon-text-pink {
            text-shadow: 0 0 5px #ff007f, 0 0 10px #ff007f, 0 0 20px #ff007f;
        }
        .neon-border-cyan {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5), inset 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Pulsing animation */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        .pulse-btn {
            animation: pulse-glow 2s infinite;
        }

        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Virtual D-pad active feedback */
        .dpad-btn:active {
            background-color: rgba(0, 240, 255, 0.4) !important;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center text-slate-100 p-2 sm:p-4 select-none">

    <!-- Top Navigation / Header Stats -->
    <header class="w-full max-w-4xl glass-panel rounded-2xl p-3 px-5 flex justify-between items-center z-10 shadow-lg border-cyan-500/30 border">
        <div class="flex items-center gap-3">
            <i data-lucide="zap" class="text-cyan-400 w-7 h-7 animate-pulse"></i>
            <div>
                <h1 class="font-orbitron font-extrabold text-lg sm:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500">
                    NEON SNAKE
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">CYBERPUNK ARCADE EDITION</p>
            </div>
        </div>

        <div class="flex items-center gap-4 sm:gap-8 font-orbitron">
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block tracking-widest uppercase">Score</span>
                <span id="scoreDisplay" class="text-xl sm:text-2xl font-bold text-cyan-400">0</span>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block tracking-widest uppercase">High Score</span>
                <span id="highScoreDisplay" class="text-xl sm:text-2xl font-bold text-pink-500">0</span>
            </div>
            <button id="settingsBtn" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700/50">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Active Power-up Status Bar -->
    <div id="powerupBarContainer" class="w-full max-w-4xl h-8 my-1 flex items-center justify-center gap-3 font-orbitron text-xs opacity-0 transition-opacity duration-300">
        <span id="powerupBadge" class="px-3 py-1 rounded-full font-bold uppercase tracking-wider flex items-center gap-1.5 shadow-md">
            <!-- Dynamic Content -->
        </span>
        <div class="w-36 bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
            <div id="powerupTimer" class="h-full bg-cyan-400 w-full transition-all duration-100 ease-linear"></div>
        </div>
    </div>

    <!-- Main Game View Container -->
    <main class="relative w-full max-w-4xl flex-1 flex items-center justify-center my-1">
        <!-- Canvas Wrapper for responsive square layout -->
        <div id="canvasWrapper" class="relative w-full h-full max-h-[65vh] aspect-square flex items-center justify-center rounded-2xl overflow-hidden glass-panel border border-slate-800 shadow-2xl">
            <canvas id="gameCanvas" class="block w-full h-full rounded-2xl"></canvas>

            <!-- Game Overlay Screens -->
            <!-- Start Screen -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 transition-opacity duration-300">
                <div class="max-w-md space-y-6">
                    <div class="inline-block p-4 rounded-full bg-cyan-500/10 border border-cyan-500/30 mb-2">
                        <i data-lucide="gamepad-2" class="w-16 h-16 text-cyan-400 animate-bounce"></i>
                    </div>
                    <h2 class="font-orbitron text-3xl sm:text-4xl font-black text-white tracking-widest neon-text-cyan">
                        READY PLAYER ONE
                    </h2>
                    <p class="text-slate-300 text-sm sm:text-base">
                        Navigate the grid, collect power-ups, build the longest snake, and beat the high score!
                    </p>
                    <button id="startGameBtn" class="pulse-btn w-full py-4 px-8 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl font-orbitron font-bold text-lg text-white shadow-lg shadow-cyan-500/30 hover:brightness-110 active:scale-95 transition">
                        START GAME
                    </button>
                </div>
            </div>

            <!-- Pause Screen -->
            <div id="pauseOverlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                <h2 class="font-orbitron text-4xl font-black text-amber-400 tracking-widest mb-6 neon-text-pink">
                    GAME PAUSED
                </h2>
                <button id="resumeGameBtn" class="py-3 px-8 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-orbitron font-bold rounded-xl shadow-lg shadow-cyan-500/30 transition active:scale-95">
                    RESUME
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="gameOverOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="max-w-md space-y-5">
                    <h2 class="font-orbitron text-3xl sm:text-4xl font-black text-rose-500 tracking-widest neon-text-pink">
                        SYSTEM FAILURE
                    </h2>
                    <div class="glass-panel p-4 rounded-xl space-y-2 border-rose-500/30 border">
                        <p class="text-xs text-slate-400 font-orbitron uppercase">Final Score</p>
                        <p id="finalScoreDisplay" class="text-4xl font-black font-orbitron text-cyan-400">0</p>
                        <p id="newHighscoreMsg" class="text-xs font-bold text-amber-400 hidden animate-pulse font-orbitron">★ NEW HIGH SCORE! ★</p>
                    </div>
                    <button id="restartGameBtn" class="pulse-btn w-full py-4 px-8 bg-gradient-to-r from-pink-500 to-rose-600 rounded-xl font-orbitron font-bold text-lg text-white shadow-lg shadow-pink-500/30 hover:brightness-110 active:scale-95 transition">
                        TRY AGAIN
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Touch D-Pad Controls -->
    <footer class="w-full max-w-4xl flex justify-between items-center my-1 sm:hidden px-4">
        <div class="grid grid-cols-3 gap-1.5 w-36 h-36 mx-auto">
            <div></div>
            <button id="btnUp" class="dpad-btn glass-panel border-cyan-500/40 rounded-xl flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <i data-lucide="chevron-up" class="w-8 h-8"></i>
            </button>
            <div></div>
            <button id="btnLeft" class="dpad-btn glass-panel border-cyan-500/40 rounded-xl flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <i data-lucide="chevron-left" class="w-8 h-8"></i>
            </button>
            <button id="btnPause" class="dpad-btn glass-panel border-amber-500/40 rounded-xl flex items-center justify-center text-amber-400 active:bg-amber-500/30">
                <i data-lucide="pause" class="w-6 h-6"></i>
            </button>
            <button id="btnRight" class="dpad-btn glass-panel border-cyan-500/40 rounded-xl flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <i data-lucide="chevron-right" class="w-8 h-8"></i>
            </button>
            <div></div>
            <button id="btnDown" class="dpad-btn glass-panel border-cyan-500/40 rounded-xl flex items-center justify-center text-cyan-400 active:bg-cyan-500/30">
                <i data-lucide="chevron-down" class="w-8 h-8"></i>
            </button>
            <div></div>
        </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 border border-cyan-500/30 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
                <h3 class="font-orbitron font-bold text-xl text-cyan-400 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-5 h-5"></i> CONFIGURATION
                </h3>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Speed Control -->
            <div class="space-y-2">
                <label class="font-orbitron text-xs text-slate-300 block tracking-wider uppercase">Game Speed</label>
                <div class="grid grid-cols-3 gap-2">
                    <button data-speed="slow" class="speed-option py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm font-bold hover:border-cyan-400 transition">SLOW</button>
                    <button data-speed="normal" class="speed-option py-2 rounded-lg bg-slate-800 border border-cyan-400 text-cyan-400 text-sm font-bold transition">NORMAL</button>
                    <button data-speed="fast" class="speed-option py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm font-bold hover:border-cyan-400 transition">FAST</button>
                </div>
            </div>

            <!-- Theme Selection -->
            <div class="space-y-2">
                <label class="font-orbitron text-xs text-slate-300 block tracking-wider uppercase">Visual Theme</label>
                <div class="grid grid-cols-3 gap-2">
                    <button data-theme="cyberpunk" class="theme-option p-2 rounded-lg bg-slate-800 border border-cyan-400 text-xs font-bold text-cyan-400 transition">CYBERPUNK</button>
                    <button data-theme="synthwave" class="theme-option p-2 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold hover:border-pink-500 transition">SYNTHWAVE</button>
                    <button data-theme="matrix" class="theme-option p-2 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold hover:border-emerald-400 transition">MATRIX</button>
                </div>
            </div>

            <!-- Audio Controls -->
            <div class="space-y-3 border-t border-slate-700/60 pt-4">
                <div class="flex items-center justify-between">
                    <span class="font-orbitron text-xs text-slate-300 uppercase tracking-wider">Sound FX (Synthesizer)</span>
                    <input type="checkbox" id="soundToggle" checked class="w-5 h-5 accent-cyan-400 cursor-pointer">
                </div>
            </div>

            <button id="saveSettingsBtn" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-orbitron font-bold rounded-xl shadow-lg transition">
                SAVE & APPLY
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        /**
         * Web Audio Synthesizer for Retro Arcade Effects
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playEat() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playPowerup() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playCrash() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        /**
         * Particle System for visual explosions and trail effects
         */
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 4 + 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Color Themes Definition
        const THEMES = {
            cyberpunk: {
                bg: '#05050a',
                grid: 'rgba(0, 240, 255, 0.05)',
                snakeHead: '#00f0ff',
                snakeBody: '#00a8ff',
                snakeGlow: '#00f0ff',
                food: '#ff007f',
                foodGlow: '#ff007f'
            },
            synthwave: {
                bg: '#0d021a',
                grid: 'rgba(255, 0, 127, 0.08)',
                snakeHead: '#ff007f',
                snakeBody: '#b000ff',
                snakeGlow: '#ff007f',
                food: '#ffb700',
                foodGlow: '#ffb700'
            },
            matrix: {
                bg: '#020a05',
                grid: 'rgba(0, 255, 65, 0.05)',
                snakeHead: '#00ff41',
                snakeBody: '#008f11',
                snakeGlow: '#00ff41',
                food: '#00ffff',
                foodGlow: '#00ffff'
            }
        };

        // Power-Up Types Config
        const POWERUP_TYPES = {
            SPEED: { type: 'SPEED', name: 'Speed Boost', color: '#ffb700', icon: 'zap', duration: 6000 },
            SLOW: { type: 'SLOW', name: 'Time Slow', color: '#00f0ff', icon: 'clock', duration: 7000 },
            DOUBLE: { type: 'DOUBLE', name: '2X Score', color: '#a855f7', icon: 'star', duration: 8000 }
        };

        /**
         * Main Snake Game Engine
         */
        class SnakeGame {
            constructor() {
                // DOM Elements
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.wrapper = document.getElementById('canvasWrapper');

                this.scoreDisplay = document.getElementById('scoreDisplay');
                this.highScoreDisplay = document.getElementById('highScoreDisplay');
                this.finalScoreDisplay = document.getElementById('finalScoreDisplay');
                this.newHighscoreMsg = document.getElementById('newHighscoreMsg');

                this.startOverlay = document.getElementById('startOverlay');
                this.pauseOverlay = document.getElementById('pauseOverlay');
                this.gameOverOverlay = document.getElementById('gameOverOverlay');

                this.powerupBarContainer = document.getElementById('powerupBarContainer');
                this.powerupBadge = document.getElementById('powerupBadge');
                this.powerupTimer = document.getElementById('powerupTimer');

                // Game Config Constants
                this.gridSize = 20; // 20x20 Grid
                this.speedSettings = { slow: 130, normal: 90, fast: 60 };

                // State Variables
                this.speedMode = 'normal';
                this.currentThemeKey = 'cyberpunk';
                this.theme = THEMES.cyberpunk;

                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('snake_high_score')) || 0;
                this.highScoreDisplay.textContent = this.highScore;

                this.state = 'INIT'; // INIT, PLAYING, PAUSED, GAMEOVER
                this.snake = [];
                this.renderSnake = []; // Interpolated positions for visual smoothness
                this.dir = { x: 1, y: 0 };
                this.nextDir = { x: 1, y: 0 };

                this.food = { x: 0, y: 0 };
                this.powerup = null; // Current active collectible on field
                this.activePowerup = null; // Currently active player powerup effect
                this.powerupTimerId = null;

                this.particles = [];
                this.lastStepTime = 0;
                this.animFrameId = null;

                this.audio = new SoundFX();

                this.initCanvasSize();
                this.setupEventListeners();
                this.setupTouchGestures();

                // Render initial static background
                this.draw();
            }

            initCanvasSize() {
                const rect = this.wrapper.getBoundingClientRect();
                const size = Math.floor(Math.min(rect.width, rect.height));
                this.canvas.width = size;
                this.canvas.height = size;
                this.cellSize = size / this.gridSize;
            }

            startNewGame() {
                this.audio.init();
                this.score = 0;
                this.scoreDisplay.textContent = '0';
                this.dir = { x: 1, y: 0 };
                this.nextDir = { x: 1, y: 0 };

                // Create initial 3-segment snake centered
                const startX = Math.floor(this.gridSize / 2);
                const startY = Math.floor(this.gridSize / 2);
                this.snake = [
                    { x: startX, y: startY },
                    { x: startX - 1, y: startY },
                    { x: startX - 2, y: startY }
                ];

                // Copy for smooth interpolation
                this.renderSnake = this.snake.map(segment => ({ ...segment }));

                this.clearActivePowerup();
                this.spawnFood();
                this.powerup = null;

                this.state = 'PLAYING';
                this.hideOverlays();

                this.lastStepTime = performance.now();
                if (this.animFrameId) cancelAnimationFrame(this.animFrameId);
                this.gameLoop(performance.now());
            }

            hideOverlays() {
                this.startOverlay.classList.add('hidden');
                this.pauseOverlay.classList.add('hidden');
                this.gameOverOverlay.classList.add('hidden');
            }

            spawnFood() {
                let valid = false;
                while (!valid) {
                    const x = Math.floor(Math.random() * this.gridSize);
                    const y = Math.floor(Math.random() * this.gridSize);
                    valid = !this.snake.some(s => s.x === x && s.y === y);
                    if (valid) {
                        this.food = { x, y };
                    }
                }

                // Chance to spawn Power-up if none present
                if (!this.powerup && Math.random() < 0.3) {
                    this.spawnPowerup();
                }
            }

            spawnPowerup() {
                let valid = false;
                let x, y;
                while (!valid) {
                    x = Math.floor(Math.random() * this.gridSize);
                    y = Math.floor(Math.random() * this.gridSize);
                    valid = !this.snake.some(s => s.x === x && s.y === y) && (x !== this.food.x || y !== this.food.y);
                }

                const keys = Object.keys(POWERUP_TYPES);
                const randomType = POWERUP_TYPES[keys[Math.floor(Math.random() * keys.length)]];
                this.powerup = { x, y, ...randomType };
            }

            triggerPowerup(powerup) {
                this.clearActivePowerup();
                this.activePowerup = powerup;
                this.audio.playPowerup();

                // UI Status Update
                this.powerupBadge.style.backgroundColor = powerup.color;
                this.powerupBadge.style.color = '#000';
                this.powerupBadge.innerHTML = `<i data-lucide="${powerup.icon}" class="w-4 h-4"></i> ${powerup.name}`;
                lucide.createIcons();
                this.powerupBarContainer.style.opacity = '1';

                const startTime = performance.now();
                const duration = powerup.duration;

                const updateTimer = () => {
                    if (this.state !== 'PLAYING') return;
                    const elapsed = performance.now() - startTime;
                    const remaining = Math.max(0, 1 - elapsed / duration);
                    this.powerupTimer.style.width = `${remaining * 100}%`;

                    if (remaining > 0) {
                        this.powerupTimerId = requestAnimationFrame(updateTimer);
                    } else {
                        this.clearActivePowerup();
                    }
                };
                this.powerupTimerId = requestAnimationFrame(updateTimer);
            }

            clearActivePowerup() {
                if (this.powerupTimerId) cancelAnimationFrame(this.powerupTimerId);
                this.activePowerup = null;
                this.powerupBarContainer.style.opacity = '0';
            }

            getStepInterval() {
                let base = this.speedSettings[this.speedMode];
                if (this.activePowerup) {
                    if (this.activePowerup.type === 'SPEED') base *= 0.6;
                    if (this.activePowerup.type === 'SLOW') base *= 1.5;
                }
                return base;
            }

            /**
             * Discrete Logic Tick
             */
            updateStep() {
                this.dir = { ...this.nextDir };
                const head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };

                // Collision Detection: Walls
                if (head.x < 0 || head.x >= this.gridSize || head.y < 0 || head.y >= this.gridSize) {
                    this.triggerGameOver();
                    return;
                }

                // Collision Detection: Self
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.triggerGameOver();
                    return;
                }

                // Move Snake
                this.snake.unshift(head);

                // Food Collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    let pts = 10;
                    if (this.activePowerup && this.activePowerup.type === 'DOUBLE') pts *= 2;
                    this.score += pts;
                    this.scoreDisplay.textContent = this.score;

                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        this.highScoreDisplay.textContent = this.highScore;
                        localStorage.setItem('snake_high_score', this.highScore);
                    }

                    this.audio.playEat();
                    this.createExplosion((head.x + 0.5) * this.cellSize, (head.y + 0.5) * this.cellSize, this.theme.food);
                    this.spawnFood();
                } else {
                    this.snake.pop(); // Remove tail
                }

                // Powerup Collision
                if (this.powerup && head.x === this.powerup.x && head.y === this.powerup.y) {
                    this.createExplosion((head.x + 0.5) * this.cellSize, (head.y + 0.5) * this.cellSize, this.powerup.color);
                    this.triggerPowerup(this.powerup);
                    this.powerup = null;
                }
            }

            /**
             * Continuous Smooth Animation Loop
             */
            gameLoop(timestamp) {
                if (this.state !== 'PLAYING') return;

                const interval = this.getStepInterval();
                const delta = timestamp - this.lastStepTime;

                if (delta >= interval) {
                    this.updateStep();
                    this.lastStepTime = timestamp;
                }

                // Smooth position interpolation factor (0.0 to 1.0)
                const progress = Math.min(1, (timestamp - this.lastStepTime) / interval);
                this.updateRenderPositions(progress);

                // Update particles
                this.particles.forEach((p, idx) => {
                    p.update();
                    if (p.alpha <= 0) this.particles.splice(idx, 1);
                });

                this.draw();
                this.animFrameId = requestAnimationFrame(t => this.gameLoop(t));
            }

            updateRenderPositions(progress) {
                this.renderSnake = this.snake.map((seg, i) => {
                    if (i === 0) {
                        // Interpolate Head from previous position
                        const prevX = seg.x - this.dir.x;
                        const prevY = seg.y - this.dir.y;
                        return {
                            x: prevX + (seg.x - prevX) * progress,
                            y: prevY + (seg.y - prevY) * progress
                        };
                    } else {
                        // Smooth follow logic for body
                        const target = this.snake[i - 1];
                        return {
                            x: seg.x + (target.x - seg.x) * progress * 0.8,
                            y: seg.y + (target.y - seg.y) * progress * 0.8
                        };
                    }
                });
            }

            createExplosion(x, y, color) {
                for (let i = 0; i < 20; i++) {
                    this.particles.push(new Particle(x, y, color));
                }
            }

            /**
             * Canvas Rendering Engine
             */
            draw() {
                const ctx = this.ctx;
                const size = this.canvas.width;
                const cs = this.cellSize;

                // Clear & Background
                ctx.fillStyle = this.theme.bg;
                ctx.fillRect(0, 0, size, size);

                // Draw Grid
                ctx.strokeStyle = this.theme.grid;
                ctx.lineWidth = 1;
                for (let i = 0; i <= this.gridSize; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cs, 0); ctx.lineTo(i * cs, size);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * cs); ctx.lineTo(size, i * cs);
                    ctx.stroke();
                }

                // Draw Food (Pulsing Cyber Orb)
                if (this.state === 'PLAYING' || this.state === 'PAUSED') {
                    const foodX = (this.food.x + 0.5) * cs;
                    const foodY = (this.food.y + 0.5) * cs;
                    const pulse = Math.sin(performance.now() * 0.008) * 2;

                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.theme.foodGlow;
                    ctx.fillStyle = this.theme.food;
                    ctx.beginPath();
                    ctx.arc(foodX, foodY, Math.max(2, cs * 0.35 + pulse), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Draw Power-Up Item
                if (this.powerup && (this.state === 'PLAYING' || this.state === 'PAUSED')) {
                    const px = (this.powerup.x + 0.5) * cs;
                    const py = (this.powerup.y + 0.5) * cs;
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.powerup.color;
                    ctx.fillStyle = this.powerup.color;
                    ctx.fillRect(px - cs * 0.3, py - cs * 0.3, cs * 0.6, cs * 0.6);
                    ctx.restore();
                }

                // Draw Snake Smooth Segments
                if (this.renderSnake.length > 0) {
                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.theme.snakeGlow;

                    for (let i = this.renderSnake.length - 1; i >= 0; i--) {
                        const seg = this.renderSnake[i];
                        const x = seg.x * cs + cs * 0.1;
                        const y = seg.y * cs + cs * 0.1;
                        const segSize = cs * 0.8;
                        const radius = i === 0 ? segSize * 0.35 : segSize * 0.2;

                        ctx.fillStyle = i === 0 ? this.theme.snakeHead : this.theme.snakeBody;
                        ctx.beginPath();
                        ctx.roundRect(x, y, segSize, segSize, radius);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Draw Particles
                this.particles.forEach(p => p.draw(ctx));
            }

            triggerGameOver() {
                this.state = 'GAMEOVER';
                this.audio.playCrash();

                // Explode snake into particles
                this.snake.forEach(seg => {
                    this.createExplosion((seg.x + 0.5) * this.cellSize, (seg.y + 0.5) * this.cellSize, this.theme.snakeHead);
                });

                this.finalScoreDisplay.textContent = this.score;
                if (this.score === this.highScore && this.score > 0) {
                    this.newHighscoreMsg.classList.remove('hidden');
                } else {
                    this.newHighscoreMsg.classList.add('hidden');
                }

                this.gameOverOverlay.classList.remove('hidden');
            }

            togglePause() {
                if (this.state === 'PLAYING') {
                    this.state = 'PAUSED';
                    this.pauseOverlay.classList.remove('hidden');
                } else if (this.state === 'PAUSED') {
                    this.state = 'PLAYING';
                    this.pauseOverlay.classList.add('hidden');
                    this.lastStepTime = performance.now();
                    this.gameLoop(performance.now());
                }
            }

            setDirection(newDir) {
                // Prevent 180-degree reverse turns
                if (newDir.x === -this.dir.x && newDir.y === 0) return;
                if (newDir.y === -this.dir.y && newDir.x === 0) return;
                this.nextDir = newDir;
            }

            setupEventListeners() {
                // Resize Handler
                window.addEventListener('resize', () => {
                    this.initCanvasSize();
                    this.draw();
                });

                // Keyboard Controls
                window.addEventListener('keydown', (e) => {
                    if (this.state !== 'PLAYING' && this.state !== 'PAUSED') return;

                    switch (e.key) {
                        case 'ArrowUp': case 'w': case 'W':
                            this.setDirection({ x: 0, y: -1 }); break;
                        case 'ArrowDown': case 's': case 'S':
                            this.setDirection({ x: 0, y: 1 }); break;
                        case 'ArrowLeft': case 'a': case 'A':
                            this.setDirection({ x: -1, y: 0 }); break;
                        case 'ArrowRight': case 'd': case 'D':
                            this.setDirection({ x: 1, y: 0 }); break;
                        case ' ': case 'p': case 'P':
                            this.togglePause(); break;
                    }
                });

                // Start/Restart/Resume Buttons
                document.getElementById('startGameBtn').addEventListener('click', () => this.startNewGame());
                document.getElementById('restartGameBtn').addEventListener('click', () => this.startNewGame());
                document.getElementById('resumeGameBtn').addEventListener('click', () => this.togglePause());

                // On-screen D-Pad Buttons
                document.getElementById('btnUp').addEventListener('click', () => this.setDirection({ x: 0, y: -1 }));
                document.getElementById('btnDown').addEventListener('click', () => this.setDirection({ x: 0, y: 1 }));
                document.getElementById('btnLeft').addEventListener('click', () => this.setDirection({ x: -1, y: 0 }));
                document.getElementById('btnRight').addEventListener('click', () => this.setDirection({ x: 1, y: 0 }));
                document.getElementById('btnPause').addEventListener('click', () => this.togglePause());

                // Settings Modal Controls
                const modal = document.getElementById('settingsModal');
                document.getElementById('settingsBtn').addEventListener('click', () => modal.classList.remove('hidden'));
                document.getElementById('closeSettingsBtn').addEventListener('click', () => modal.classList.add('hidden'));

                // Speed Selector
                document.querySelectorAll('.speed-option').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.speed-option').forEach(b => {
                            b.classList.remove('border-cyan-400', 'text-cyan-400');
                            b.classList.add('border-slate-700');
                        });
                        e.target.classList.add('border-cyan-400', 'text-cyan-400');
                        this.speedMode = e.target.dataset.speed;
                    });
                });

                // Theme Selector
                document.querySelectorAll('.theme-option').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.theme-option').forEach(b => {
                            b.classList.remove('border-cyan-400', 'text-cyan-400', 'border-pink-500', 'border-emerald-400');
                            b.classList.add('border-slate-700');
                        });
                        e.target.classList.add('border-cyan-400', 'text-cyan-400');
                        this.currentThemeKey = e.target.dataset.theme;
                        this.theme = THEMES[this.currentThemeKey];
                        this.draw();
                    });
                });

                // Sound Toggle
                document.getElementById('soundToggle').addEventListener('change', (e) => {
                    this.audio.enabled = e.target.checked;
                });

                document.getElementById('saveSettingsBtn').addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }

            setupTouchGestures() {
                let startX = 0;
                let startY = 0;

                this.canvas.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }, { passive: true });

                this.canvas.addEventListener('touchend', (e) => {
                    if (this.state !== 'PLAYING') return;

                    const endX = e.changedTouches[0].clientX;
                    const endY = e.changedTouches[0].clientY;

                    const dx = endX - startX;
                    const dy = endY - startY;

                    // Minimum swipe threshold
                    if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                        if (Math.abs(dx) > Math.abs(dy)) {
                            // Horizontal Swipe
                            if (dx > 0) this.setDirection({ x: 1, y: 0 });
                            else this.setDirection({ x: -1, y: 0 });
                        } else {
                            // Vertical Swipe
                            if (dy > 0) this.setDirection({ x: 0, y: 1 });
                            else this.setDirection({ x: 0, y: -1 });
                        }
                    }
                }, { passive: true });
            }
        }

        // Initialize Game Instance on Window Load
        window.onload = () => {
            lucide.createIcons();
            window.game = new SnakeGame();
        };
    </script>
</body>
</html>
